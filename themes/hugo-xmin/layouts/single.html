{{ partial "header.html" . }}
<div class="article-meta">
	<h1><span class="title">{{ .Title | markdownify }}</span></h1>


	{{ if .Params.period }}
	<span>{{ .Params.period }}</span>
	{{ else if .Date }}
	<time datetime="{{ .Date.Format "2006-01-02" }}">
		{{ .Date.Format "Jan 2, 2006" }}
	</time>
	{{ end }}
</div>

<main>
	{{ .Content }}
</main>

{{ partial "footer.html" . }}
